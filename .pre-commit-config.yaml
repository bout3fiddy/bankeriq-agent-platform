repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff formatting
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: python-readability
        name: Python paragraph spacing
        entry: uv run --locked python scripts/linting/check_readability.py
        language: system
        types: [python]
        pass_filenames: false
      - id: basedpyright
        name: Python types
        entry: uv run --locked basedpyright
        language: system
        types: [python]
        pass_filenames: false
      - id: uv-lock
        name: Dependency lock consistency
        entry: uv lock --check
        language: system
        files: '^(pyproject.toml|uv.lock)$'
        pass_filenames: false

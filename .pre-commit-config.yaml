repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Python formatting
        entry: uv run --locked python -m scripts.format_python --check
        language: system
        types: [python]
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: python-readability
        name: Python paragraph and comment spacing
        entry: uv run --locked python scripts/linting/check_readability.py
        language: system
        types: [python]
        pass_filenames: false
      - id: json-style
        name: JSON validity and 100-character lines
        entry: uv run --locked python -m scripts.linting.check_json
        language: system
        types: [json]
        pass_filenames: false
      - id: line-length
        name: Repository 100-character lines
        entry: uv run --locked python -m scripts.linting.check_line_length
        language: system
        always_run: true
        pass_filenames: false
      - id: basedpyright
        name: Python types
        entry: uv run --locked basedpyright
        language: system
        types: [python]
        pass_filenames: false
      - id: uv-lock
        name: Dependency lock consistency
        entry: uv lock --check
        language: system
        files: '^(pyproject.toml|uv.lock)$'
        pass_filenames: false
